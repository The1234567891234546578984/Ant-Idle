<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ant Idle — 3D builds</title>
<meta name="description" content="Ant Idle — a home for interactive 3D games and animations built in the browser." />
<style>
  :root {
    --ink: #eaf2ff;
    --dim: #8fa3c0;
    --line: rgba(120, 200, 255, 0.18);
    --accent: #4ff0c8;
    --accent-2: #7aa8ff;
    --bg: #05070d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #grid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }
  .glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(60% 55% at 50% 18%, rgba(122, 168, 255, 0.20), transparent 70%),
      radial-gradient(45% 40% at 82% 88%, rgba(79, 240, 200, 0.13), transparent 70%),
      linear-gradient(to bottom, transparent 40%, rgba(5, 7, 13, 0.92) 100%);
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.75) 100%);
  }
  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 32px 24px;
    gap: 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(10, 16, 28, 0.55);
    backdrop-filter: blur(6px);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 28px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.78); }
  }
  h1 {
    font-size: clamp(44px, 11vw, 132px);
    line-height: 0.92;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.045em;
    background: linear-gradient(180deg, #ffffff 8%, #9fc0ff 62%, #4ff0c8 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rule {
    width: min(340px, 60vw);
    height: 1px;
    margin: 30px 0 26px;
    background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent);
    opacity: 0.75;
  }
  p.lede {
    max-width: 46ch;
    margin: 0;
    font-size: clamp(15px, 2.1vw, 19px);
    line-height: 1.65;
    color: #b9cae4;
  }
  .meta {
    margin-top: 46px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 12px;
    justify-content: center;
  }
  .chip {
    font-size: 12.5px;
    letter-spacing: 0.05em;
    color: var(--dim);
    border: 1px solid rgba(140, 170, 210, 0.16);
    border-radius: 8px;
    padding: 8px 13px;
    background: rgba(10, 16, 28, 0.4);
  }
  footer {
    position: fixed;
    bottom: 22px;
    left: 0; right: 0;
    z-index: 2;
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(143, 163, 192, 0.55);
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<div class="glow"></div>
<div class="vignette"></div>

<main>
  <div class="badge"><span class="dot"></span> Live</div>
  <h1>ANT IDLE</h1>
  <div class="rule"></div>
  <p class="lede">
    A home for interactive 3D games and animations, rendered live in the
    browser. The first build lands here next.
  </p>
  <div class="meta">
    <span class="chip">Three.js scenes</span>
    <span class="chip">Single-file builds</span>
    <span class="chip">No install</span>
  </div>
</main>

<footer>Ant Idle &middot; 3D in the browser</footer>

<script>
(function () {
  var canvas = document.getElementById("grid");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var t = 0;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // A slowly receding perspective grid: cheap, dependency-free, and it reads
  // as depth even though it is pure 2D canvas.
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var horizon = H * 0.52;
    var vpx = W / 2;
    var rows = 26;
    var cols = 22;

    ctx.lineWidth = 1;
    for (var i = 0; i <= rows; i++) {
      var p = (i + (t % 1)) / rows;          // 0 at horizon -> 1 at viewer
      var depth = Math.pow(p, 2.35);          // compress near the horizon
      var y = horizon + depth * (H - horizon) * 1.06;
      if (y > H + 2) continue;
      var alpha = Math.min(0.05 + p * 0.30, 0.36);
      ctx.strokeStyle = "rgba(122, 168, 255, " + alpha.toFixed(3) + ")";
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    for (var j = -cols; j <= cols; j++) {
      var xFar = vpx + j * (W * 0.021);
      var xNear = vpx + j * (W * 0.155);
      var grad = ctx.createLinearGradient(0, horizon, 0, H);
      grad.addColorStop(0, "rgba(122, 168, 255, 0)");
      grad.addColorStop(0.35, "rgba(79, 240, 200, 0.10)");
      grad.addColorStop(1, "rgba(79, 240, 200, 0.26)");
      ctx.strokeStyle = grad;
      ctx.beginPath();
      ctx.moveTo(xFar, horizon);
      ctx.lineTo(xNear, H);
      ctx.stroke();
    }

    // horizon flare
    var flare = ctx.createRadialGradient(vpx, horizon, 0, vpx, horizon, Math.min(W, H) * 0.42);
    flare.addColorStop(0, "rgba(79, 240, 200, 0.14)");
    flare.addColorStop(1, "rgba(79, 240, 200, 0)");
    ctx.fillStyle = flare;
    ctx.fillRect(0, horizon - Math.min(W, H) * 0.42, W, Math.min(W, H) * 0.42);
  }

  var last = 0;
  function loop(now) {
    if (!reduced && now - last > 16) {
      t += 0.0016 * (now - last);
      draw();
      last = now;
    }
    requestAnimationFrame(loop);
  }

  resize();
  draw();
  window.addEventListener("resize", function () { resize(); draw(); });
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
